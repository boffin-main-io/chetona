<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: #10101a; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
  #hint {
    position: absolute; top: 8px; left: 8px; color: #aaa; font: 11px monospace;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap a node for details</div>
<script>
/*
 * Chetona relationship graph — dependency-free force-directed layout.
 * এটা কোনো CDN/library লোড করে না, তাই LAN-এ internet ছাড়াও কাজ করে।
 * Android renderGraph(jsonString) কল করে ডেটা পাঠায়।
 */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let nodes = [];
let edges = [];
let factionColors = {};

const palette = ['#e07a5f', '#81b29a', '#f2cc8f', '#3d5a80', '#9b5de5', '#f15bb5'];

function renderGraph(jsonString) {
  const data = JSON.parse(jsonString);
  factionColors = {};
  (data.factions || []).forEach((f, i) => { factionColors[f.id] = palette[i % palette.length]; });

  nodes = (data.nodes || []).map(n => ({
    ...n,
    x: W / 2 + (Math.random() - 0.5) * 200,
    y: H / 2 + (Math.random() - 0.5) * 200,
    vx: 0, vy: 0,
  }));
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  edges = (data.edges || [])
    .map(e => ({ a: byId[e.a], b: byId[e.b], affinity: e.affinity }))
    .filter(e => e.a && e.b);
}

function step() {
  // repulsion between all nodes
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let distSq = dx * dx + dy * dy || 0.01;
      let force = 1800 / distSq;
      let dist = Math.sqrt(distSq);
      dx /= dist; dy /= dist;
      a.vx += dx * force; a.vy += dy * force;
      b.vx -= dx * force; b.vy -= dy * force;
    }
  }
  // spring along edges, strength/direction depends on affinity
  edges.forEach(e => {
    let dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
    let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const targetLen = e.affinity >= 0 ? 90 : 220; // hostile pairs pushed further apart
    const strength = 0.02 * (0.3 + Math.abs(e.affinity));
    const diff = (dist - targetLen) * strength;
    dx /= dist; dy /= dist;
    e.a.vx += dx * diff; e.a.vy += dy * diff;
    e.b.vx -= dx * diff; e.b.vy -= dy * diff;
  });
  // center pull + integrate + damping
  nodes.forEach(n => {
    n.vx += (W / 2 - n.x) * 0.001;
    n.vy += (H / 2 - n.y) * 0.001;
    n.vx *= 0.85; n.vy *= 0.85;
    n.x += n.vx; n.y += n.vy;
  });
}

function draw() {
  ctx.fillStyle = '#10101a';
  ctx.fillRect(0, 0, W, H);

  edges.forEach(e => {
    ctx.strokeStyle = e.affinity >= 0
      ? `rgba(129,178,154,${0.2 + Math.abs(e.affinity) * 0.6})`
      : `rgba(224,122,95,${0.2 + Math.abs(e.affinity) * 0.6})`;
    ctx.lineWidth = 1 + Math.abs(e.affinity) * 2;
    ctx.beginPath();
    ctx.moveTo(e.a.x, e.a.y);
    ctx.lineTo(e.b.x, e.b.y);
    ctx.stroke();
  });

  nodes.forEach(n => {
    const r = 8 + n.self_awareness * 10;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = n.alive ? (factionColors[n.faction_id] || '#888') : '#333';
    ctx.globalAlpha = n.alive ? 1 : 0.4;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = `rgba(255,80,80,${n.paranoia})`;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#eee';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(n.name, n.x, n.y - r - 4);
  });
}

function loop() {
  step();
  draw();
  requestAnimationFrame(loop);
}
loop();

canvas.addEventListener('click', (ev) => {
  const rect = canvas.getBoundingClientRect();
  const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  const hit = nodes.find(n => Math.hypot(n.x - x, n.y - y) < 20);
  document.getElementById('hint').innerText = hit
    ? `${hit.name} — self-awareness ${hit.self_awareness}, paranoia ${hit.paranoia}`
    : 'tap a node for details';
});
</script>
</body>
</html>
